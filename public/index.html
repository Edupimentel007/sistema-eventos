<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gestão de eventos e acompanhamento do seu grande dia." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/calendar.css" />
    <link rel="stylesheet" href="/features.css" />
    <title>Paulo Guimarães — Decorações de Eventos</title>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('paulo-guimaraes-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved :
          (window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content',
          theme === 'dark' ? '#171717' : '#f7f7f5');
      })();
    </script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
